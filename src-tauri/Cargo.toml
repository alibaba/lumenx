[package]
name = "lumenx-studio"
version = "1.2.1"
description = "LumenX Studio - AI Comic Video Production Platform"
authors = ["LumenX Team"]
edition = "2021"

[lib]
name = "lumenx_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# cocoa/objc retained for potential future use (e.g. NSVisualEffectView vibrancy)
cocoa = "0.26"
objc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
