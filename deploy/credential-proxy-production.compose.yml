services:
  credential-proxy:
    environment:
      - LUMENX_CREDENTIAL_PROXY_PROVIDER=file
      - LUMENX_CREDENTIAL_PROXY_SECRET_FILE=/run/secrets/lumenx_credentials
    secrets:
      - lumenx_credentials

secrets:
  lumenx_credentials:
    file: ${LUMENX_CREDENTIALS_FILE:?set LUMENX_CREDENTIALS_FILE to a root-owned secret JSON file}
