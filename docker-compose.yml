services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lumenx-backend
    env_file:
      - .env
    environment:
      - NO_PROXY=*.aliyuncs.com,localhost,127.0.0.1
      - LUMENX_DEV_CONFIG_PATH=/app/output/config/runtime.env
      - LUMENX_API_HOST=0.0.0.0
      - LUMENX_API_PORT=${LUMENX_API_PORT:-18177}
    volumes:
      - ./output:/app/output
    ports:
      - "${LUMENX_API_PORT:-18177}:${LUMENX_API_PORT:-18177}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lumenx-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
