# Local trial only. For ECS HTTPS and proxy trust, follow P10/HEADLESS-TRIAL.md.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      - NO_PROXY=*.aliyuncs.com,localhost,127.0.0.1
    volumes:
      - lumenx_user_data:/var/lib/lumenx
      # Preserve existing host projects while persisting configuration/logs too.
      - ./output:/var/lib/lumenx/output
    ports:
      - "127.0.0.1:17177:17177"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["skill-production"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lumenx_redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["skill-production"]
    environment:
      POSTGRES_DB: lumenx
      POSTGRES_USER: lumenx
      POSTGRES_PASSWORD: lumenx-local-only
    volumes:
      - lumenx_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumenx -d lumenx"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  skill-worker:
    build:
      context: .
      dockerfile: Dockerfile.skill-worker
    profiles: ["skill-production"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    ports:
      - "127.0.0.1:19100:9100"
    environment:
      - LUMENX_SKILL_QUEUE_BACKEND=redis
      - LUMENX_SKILL_REDIS_URL=redis://redis:6379/0
      - LUMENX_SKILL_QUEUE_NAME=lumenx:skill-runs
      - LUMENX_SKILL_WORKER_ONCE=0
      - LUMENX_METRICS_PORT=9100
      - LUMENX_CREDENTIAL_PROXY_URL=http://credential-proxy:17178/v1/credentials/issue
      - LUMENX_CREDENTIAL_PROXY_TOKEN=${LUMENX_CREDENTIAL_PROXY_TOKEN:-local-worker-token}
    depends_on:
      - redis
      - credential-proxy
    restart: unless-stopped

  credential-proxy:
    build:
      context: .
      dockerfile: Dockerfile.credential-proxy
    profiles: ["skill-production"]
    command: ["python", "-m", "src.apps.platform.credential_proxy_service"]
    environment:
      - LUMENX_CREDENTIAL_PROXY_TOKEN=${LUMENX_CREDENTIAL_PROXY_TOKEN:-local-worker-token}
      - LUMENX_CREDENTIAL_CORE_TOKEN=${LUMENX_CREDENTIAL_CORE_TOKEN:-local-core-token}
      - LUMENX_CREDENTIAL_PROXY_SECRETS_JSON=${LUMENX_CREDENTIAL_PROXY_SECRETS_JSON:-{}}
      - LUMENX_CREDENTIAL_PROXY_PORT=17178
    ports:
      - "127.0.0.1:17178:17178"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["skill-production", "monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - lumenx_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - skill-worker
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["skill-production", "monitoring"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:14318:4318"
    depends_on:
      - skill-worker
    restart: unless-stopped

volumes:
  lumenx_user_data:
  lumenx_redis_data:
  lumenx_postgres_data:
  lumenx_prometheus_data:
