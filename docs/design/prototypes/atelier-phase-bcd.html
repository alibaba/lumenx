<style>
  :root, html.dark {
    --color-bg-base: #050508;
    --color-bg-surface: rgba(0, 0, 0, 0.4);
    --color-bg-elevated: #1a1a1a;
    --color-bg-input: rgba(0, 0, 0, 0.3);
    --color-bg-hover: rgba(255, 255, 255, 0.05);
    --color-glass: rgba(255, 255, 255, 0.05);
    --color-border-default: rgba(255, 255, 255, 0.10);
    --color-border-subtle: rgba(255, 255, 255, 0.05);
    --color-text-primary: #ededed;
    --color-text-secondary: #9ca3af;
    --color-text-muted: #6b7280;
    --color-overlay: rgba(0, 0, 0, 0.8);
    --color-bg-inset: rgba(255, 255, 255, 0.03);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #050508;
    color: var(--color-text-primary);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* Mirror globals.css utilities */
  .glass-panel { background: var(--color-glass); backdrop-filter: blur(12px); border: 1px solid var(--color-border-default); }
  .glass-input { background: var(--color-bg-input); backdrop-filter: blur(6px); border: 1px solid var(--color-border-default); border-radius: 6px; padding: 8px 12px; transition: border-color 0.15s ease; }
  .glass-input:focus { outline: none; border-color: rgba(100, 108, 255, 0.5); }
  .glass-button { background: var(--color-bg-hover); backdrop-filter: blur(6px); border: 1px solid var(--color-border-default); border-radius: 6px; padding: 8px 16px; transition: all 0.15s ease; }
  .glass-button:hover { background: var(--color-glass); }
  .glass-button:active { transform: scale(0.95); }

  /* Tooltip via data-tip */
  .btn-tip { position: relative; }
  .btn-tip::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; padding: 3px 8px; border-radius: 4px;
    font-size: 10px; background: var(--color-bg-elevated);
    border: 1px solid var(--color-border-default);
    color: var(--color-text-secondary);
    pointer-events: none; opacity: 0;
    transition: opacity 0.15s ease; transition-delay: 0s;
    z-index: 60;
  }
  .btn-tip:hover::after { opacity: 1; transition-delay: 0.25s; }

  /* Dotted canvas grid */
  .dotted-canvas {
    background-color: #050508;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* Scrollbars (subtle) */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Pulse for agent thinking */
  @keyframes softPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
  .pulse-dot { animation: softPulse 1.5s ease-in-out infinite; }

  /* Fade for skeleton */
  @keyframes shimmer { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.55; } }
  .shimmer { animation: shimmer 1.4s ease-in-out infinite; }

  /* Spin */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  /* Hide horizontal overflow on header */
  .scene-tabs::-webkit-scrollbar { height: 0; }
</style>

const { useState, useEffect, useMemo } = React;

/* ------------------------------------------------------------------ */
/* 1. Inline lucide-style icons.                                       */
/*    Stroke 1.6, currentColor — keeps spec consistent with frontend.  */
/* ------------------------------------------------------------------ */
const Icon = ({ name, size = 16, className = "" }) => {
  const stroke = "currentColor";
  const sw = 1.6;
  const props = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke, strokeWidth: sw, strokeLinecap: "round", strokeLinejoin: "round", className };
  switch (name) {
    case "film":      return <svg {...props}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7h4M3 12h4M3 17h4M17 7h4M17 12h4M17 17h4"/></svg>;
    case "image":     return <svg {...props}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>;
    case "lightbulb": return <svg {...props}><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2Z"/></svg>;
    case "plus":      return <svg {...props}><path d="M12 5v14M5 12h14"/></svg>;
    case "sparkles":  return <svg {...props}><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zM19 14l.8 2.4L22 17l-2.2.6L19 20l-.8-2.4L16 17l2.2-.6L19 14zM5 14l.8 2.4L8 17l-2.2.6L5 20l-.8-2.4L2 17l2.2-.6L5 14z"/></svg>;
    case "bot":       return <svg {...props}><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4M8 4h8M9 14h.01M15 14h.01"/></svg>;
    case "shield":    return <svg {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>;
    case "check":     return <svg {...props}><path d="M20 6 9 17l-5-5"/></svg>;
    case "x":         return <svg {...props}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case "loader":    return <svg {...props}><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>;
    case "refresh":   return <svg {...props}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>;
    case "rotate":    return <svg {...props}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>;
    case "wand":      return <svg {...props}><path d="m15 4-2 2M3 21l8-8M14.5 5.5l4 4M5 14l4 4M21 21l-2-2"/></svg>;
    case "upload":    return <svg {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>;
    case "trash":     return <svg {...props}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>;
    case "link":      return <svg {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    case "maximize":  return <svg {...props}><path d="M3 3h6M3 3v6M21 3h-6M21 3v6M3 21h6M3 21v-6M21 21h-6M21 21v-6"/></svg>;
    case "zoom-in":   return <svg {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6M8 11h6"/></svg>;
    case "zoom-out":  return <svg {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></svg>;
    case "undo":      return <svg {...props}><path d="M9 14 4 9l5-5"/><path d="M4 9h11a4 4 0 1 1 0 8h-2"/></svg>;
    case "redo":      return <svg {...props}><path d="m15 14 5-5-5-5"/><path d="M20 9H9a4 4 0 1 0 0 8h2"/></svg>;
    case "mic":       return <svg {...props}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 19v3"/></svg>;
    case "paperclip": return <svg {...props}><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.4 17.24a2 2 0 0 1-2.83-2.83L15 6"/></svg>;
    case "alert":     return <svg {...props}><path d="M12 2 2 22h20L12 2z"/><path d="M12 9v4M12 17h.01"/></svg>;
    case "chevron-down":  return <svg {...props}><path d="m6 9 6 6 6-6"/></svg>;
    case "chevron-right": return <svg {...props}><path d="m9 6 6 6-6 6"/></svg>;
    case "chevron-double-right": return <svg {...props}><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></svg>;
    case "play":      return <svg {...props}><path d="m6 4 14 8-14 8V4z"/></svg>;
    case "branch":    return <svg {...props}><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M18 8v3a3 3 0 0 1-3 3H9a3 3 0 0 0-3 3v1M6 8v10"/></svg>;
    case "scissors":  return <svg {...props}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>;
    case "video":     return <svg {...props}><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>;
    case "settings":  return <svg {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    default: return null;
  }
};

/* ------------------------------------------------------------------ */
/* 2. Status tone helpers — mirror AtelierShell.tsx:73-76, 107-110.   */
/* ------------------------------------------------------------------ */
const STATUS_TONE = {
  draft:      { box: "border-white/15 bg-white/[0.05] text-text-secondary", text: "text-text-secondary" },
  pending:    { box: "border-blue-400/50 bg-blue-400/10 text-blue-200",       text: "text-blue-200" },
  processing: { box: "border-blue-400/50 bg-blue-400/10 text-blue-200",       text: "text-blue-200" },
  completed:  { box: "border-emerald-400/50 bg-emerald-400/10 text-emerald-200", text: "text-emerald-200" },
  failed:     { box: "border-red-400/50 bg-red-400/10 text-red-200",          text: "text-red-200" },
  approval_required: { box: "border-amber-300/40 bg-amber-400/[0.06] text-amber-100", text: "text-amber-100" },
};

const StatusPill = ({ status, className = "" }) => {
  const tone = STATUS_TONE[status] || STATUS_TONE.draft;
  return (
    <span className={`rounded-full border px-2 py-0.5 text-[10px] uppercase tracking-wide ${tone.box} ${className}`}>
      {status.replace("_", " ")}
    </span>
  );
};

/* ------------------------------------------------------------------ */
/* 3. Real demo media — Unsplash (cyberpunk neon / rooftop city).      */
/*    Honest placeholders for posters; no SVG-drawn imagery.           */
/* ------------------------------------------------------------------ */
const IMG = {
  cyber:     "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=480&q=70",
  neonAlley: "https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=480&q=70",
  rooftop:   "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=480&q=70",
  tokyo:     "https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=480&q=70",
  rain:      "https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=480&q=70",
  hk:        "https://images.unsplash.com/photo-1493514789931-586cb221d7a7?auto=format&fit=crop&w=480&q=70",
};

/* ------------------------------------------------------------------ */
/* 4. Common chrome — Toolbar Capsule                                  */
/* ------------------------------------------------------------------ */
const ToolbarBtn = ({ icon, label, primary, disabled, tip, children, className = "" }) => {
  const base = "btn-tip inline-flex items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-medium transition";
  const tone = primary
    ? "bg-primary text-white hover:bg-primary/90"
    : disabled
      ? "text-text-muted/60 cursor-not-allowed"
      : "text-text-secondary hover:bg-hover-bg hover:text-foreground";
  return (
    <button data-tip={tip} className={`${base} ${tone} ${className}`} disabled={disabled}>
      {icon && <Icon name={icon} size={14} />}
      {label && <span>{label}</span>}
      {children}
    </button>
  );
};

/* v0.3: capsule收窄至"创建+Agent"两段；zoom/fit 迁到 BottomNavRail。 */
const ToolbarCapsule = ({ askActive = false }) => (
  <div className="absolute left-4 top-4 z-30 flex items-center gap-1 rounded-full border border-glass-border bg-glass p-1 backdrop-blur-md">
    <ToolbarBtn icon="film"      label="Video" primary tip="New Video Node (V)" />
    <ToolbarBtn icon="image"     tip="New Image Node (I)" />
    <ToolbarBtn icon="lightbulb" tip="New Idea Node (T)" />
    <span className="mx-1 h-5 w-px bg-glass-border" />
    <ToolbarBtn icon="undo" tip="Undo (⌘Z)" />
    <ToolbarBtn icon="redo" disabled tip="Redo · Coming soon" />
    <span className="mx-1 h-5 w-px bg-glass-border" />
    <ToolbarBtn icon="sparkles" label="Ask Agent"
      tip="Ask Agent (/)"
      className={askActive ? "bg-hover-bg text-foreground" : ""} />
  </div>
);

/* v0.3 新增：BottomNavRail — minimap toggle + fit + zoom slider。 */
const BottomNavRail = ({ zoom = 100 }) => (
  <div className="absolute left-4 bottom-4 z-30 flex items-center gap-1 rounded-full border border-glass-border bg-glass p-1 backdrop-blur-md">
    <ToolbarBtn icon="maximize" tip="Toggle minimap" />
    <span className="mx-1 h-5 w-px bg-glass-border" />
    <ToolbarBtn icon="maximize" tip="Fit view (F)" />
    <ToolbarBtn icon="zoom-out" tip="Zoom out" />
    {/* Slider */}
    <div className="mx-1 flex items-center gap-2 px-2">
      <div className="relative h-1 w-24 rounded-full bg-white/10">
        <div className="absolute inset-y-0 left-0 rounded-full bg-primary/60" style={{ width: `${Math.min(100, Math.max(0, (zoom - 25) / 2.75))}%` }} />
        <div className="absolute -top-1 h-3 w-3 rounded-full bg-primary shadow-[0_0_0_3px_rgba(100,108,255,0.18)]"
             style={{ left: `calc(${Math.min(100, Math.max(0, (zoom - 25) / 2.75))}% - 6px)` }} />
      </div>
      <span className="font-mono text-[10px] text-text-muted w-9 text-right">{zoom}%</span>
    </div>
    <ToolbarBtn icon="zoom-in" tip="Zoom in" />
  </div>
);

/* Minimap floating widget — used when minimap toggle on. */
const MinimapWidget = ({ nodes = [] }) => (
  <div className="absolute bottom-16 left-4 z-30 h-[132px] w-[200px] overflow-hidden rounded-md border border-glass-border bg-elevated/85 backdrop-blur-md">
    <div className="absolute inset-0 dotted-canvas opacity-40" />
    {nodes.map((n, i) => (
      <div key={i} className="absolute h-1 w-1 rounded-full bg-primary/80" style={{ left: `${n.x}%`, top: `${n.y}%` }} />
    ))}
    {/* viewport rectangle */}
    <div className="absolute rounded border-2 border-primary/70" style={{ left: "30%", top: "32%", width: "40%", height: "36%" }} />
    <span className="absolute right-1 bottom-1 font-mono text-[9px] text-text-muted">minimap</span>
  </div>
);

/* ------------------------------------------------------------------ */
/* 5. Sequence Strip                                                   */
/* ------------------------------------------------------------------ */
const SequenceClip = ({ title, dur, accent = "emerald", thumb }) => {
  const accentClass = accent === "emerald" ? "bg-emerald-400" : "bg-blue-400";
  return (
    <div className="group relative h-[84px] w-[160px] shrink-0 overflow-hidden rounded-md border border-glass-border bg-elevated/80">
      <div className={`absolute inset-x-0 top-0 h-[2px] ${accentClass}`} />
      {thumb && <img src={thumb} alt="" className="h-full w-full object-cover opacity-80" />}
      <div className="absolute inset-x-0 bottom-0 flex items-center justify-between gap-1 bg-black/55 px-2 py-1.5 backdrop-blur-sm">
        <span className="truncate text-xs text-foreground">{title}</span>
        <span className="font-mono text-[10px] text-text-muted">{dur}</span>
      </div>
    </div>
  );
};

const AddClipSlot = () => (
  <button className="flex h-[84px] w-[64px] shrink-0 items-center justify-center rounded-md border border-dashed border-glass-border text-text-muted hover:border-primary/60 hover:text-primary">
    <Icon name="plus" size={18} />
  </button>
);

const SequenceStrip = ({ variant = "filled", className = "" }) => (
  <div className={`absolute inset-x-4 bottom-4 z-20 rounded-2xl border border-glass-border bg-glass p-3 backdrop-blur-md ${className}`}>
    <div className="mb-2 flex items-center justify-between">
      <div className="flex items-center gap-2">
        <Icon name="scissors" size={12} className="text-text-muted" />
        <span className="font-mono text-[10px] uppercase tracking-wider text-text-muted">Sequence Strip</span>
        {variant === "empty" && <span className="text-[11px] text-text-muted">— add a selected take to start a rough cut</span>}
      </div>
      <div className="flex items-center gap-3">
        <span className="font-mono text-[10px] uppercase tracking-wider text-text-muted">
          Total <span className="ml-1 text-text-secondary">{
            variant === "empty" ? "00:00:00" :
            variant === "single" ? "00:05:00" : "00:15:00"
          }</span>
        </span>
        <button className="btn-tip text-text-muted hover:text-foreground" data-tip="Collapse strip">
          <Icon name="chevron-down" size={14} />
        </button>
      </div>
    </div>
    <div className="flex items-center gap-2 overflow-x-auto">
      {variant === "empty" && (
        <div className="flex items-center gap-2 text-[11px] text-text-muted py-6">
          <span className="font-mono uppercase tracking-wider">empty</span>
          <span className="opacity-60">·</span>
          <span>select a completed take, then "Add to Sequence" from the inspector</span>
        </div>
      )}
      {variant === "single" && (
        <>
          <SequenceClip title="Rooftop_Chase" dur="00:05" thumb={IMG.rooftop} />
          <AddClipSlot />
        </>
      )}
      {variant === "filled" && (
        <>
          <SequenceClip title="Rooftop_Chase" dur="00:05" thumb={IMG.rooftop} />
          <SequenceClip title="Neon_Alley"    dur="00:05" thumb={IMG.neonAlley} />
          <SequenceClip title="Rain_City"     dur="00:03" thumb={IMG.rain} />
          <SequenceClip title="Pursuit_End"   dur="00:02" thumb={IMG.hk} />
          <AddClipSlot />
        </>
      )}
    </div>
  </div>
);

/* ------------------------------------------------------------------ */
/* 6. Video Generation Node v0.2                                       */
/*    - CompactVideoNode  : on-canvas card (state only, ≤ 320w)        */
/*    - VideoNodeInspector: floating editor (all config + candidates)  */
/* ------------------------------------------------------------------ */

const CapabilityIcon = ({ on, label, sym }) => (
  <span className={`inline-flex items-center gap-1 rounded border px-1.5 py-0.5 text-[10px] uppercase tracking-wider ${
    on ? "border-emerald-400/40 text-emerald-200/85" : "border-red-400/35 text-red-200/70"
  }`}>
    <span className="font-mono">{sym}</span>
    <span>{label}</span>
    <Icon name={on ? "check" : "x"} size={10} />
  </span>
);

const ReferenceThumb = ({ src, label, role }) => (

/* 9. Connection lines (SVG bezier)                                    */
/* ------------------------------------------------------------------ */
const ConnectionLine = ({ from, to, dashed = false, accent = "primary" }) => {
  const dx = Math.max(40, Math.abs(to.x - from.x) * 0.35);
  const path = `M ${from.x} ${from.y} C ${from.x + dx} ${from.y}, ${to.x - dx} ${to.y}, ${to.x} ${to.y}`;
  const stroke = accent === "muted" ? "rgba(156,163,175,0.35)" : "rgba(100,108,255,0.55)";
  return (
    <g>
      <path d={path} fill="none" stroke={stroke} strokeWidth="1.5"
            strokeDasharray={dashed ? "6 4" : undefined} />
      <circle cx={from.x} cy={from.y} r="3" fill="rgba(100,108,255,0.7)" />
      <circle cx={to.x} cy={to.y} r="3" fill="rgba(100,108,255,0.7)" />
    </g>
  );
};

        configSummary="1280×720 · 5s · 3×"
        refs={[IMG.hk]}
      />
      <DraftNode x={332} y={582}
        status="draft"
        intent="Sound design — rain & footsteps"
        modelLabel="CosyVoice"
        configSummary="audio · 0:30"
      />

      {/* Take cluster — 4 video takes from drafts 1 & 2, 1 audio */}
      <MediaNode kind="video" src={IMG.rooftop} filename="cine_a.mp4" duration="0:05"
        status="completed" selected selectedAsTake x={612} y={168} />
      <MediaNode kind="video" src={IMG.rain} filename="cine_b.mp4" duration="0:05"
        status="completed" x={612} y={296} />
      <MediaNode kind="video" src={IMG.tokyo} filename="cine_c.mp4" duration="0:05"
        status="completed" x={836} y={168} />
      <MediaNode kind="video" status="processing" progress={62} x={612} y={424} />
      <MediaNode kind="video" src={IMG.hk} filename="anime_b.mp4" duration="0:04"
        status="completed" x={836} y={424} />
      <MediaNode kind="audio" filename="rain_loop.mp3" duration="0:30" x={612} y={552} />

      {/* Idea node, very thin */}
      <IdeaNode x={48} y={696}
        body="The protagonist stops at the edge of the ledge. The city below is a sea of flickering neon lights." />

      {/* Action bar on the selected take */}
      <SelectionActionBar x={612} y={168} width={200} kind="video" />

      {/* Edge meaning chip on Plan → Cinematic edge */}
      <div className="absolute" style={{transform: "translate(312px, 204px)", zIndex: 6}}>
        <span className="rounded-full border border-glass-border bg-elevated px-2 py-0.5 font-mono text-[10px] uppercase tracking-wider text-text-muted">belongs_to_plan</span>

);

/* Phase D-2: Sequence Strip 全态 ------------------------------------- */
const D2_VARIANTS = [
  { id: "empty",     label: "Empty" },
  { id: "single",    label: "1 clip" },
  { id: "filled",    label: "4 clips" },
  { id: "collapsed", label: "Collapsed handle" },
];

const ScenePhaseD2 = () => {
  const [variant, setVariant] = useState("filled");
  return (
    <div className="absolute inset-0 dotted-canvas">
      <ToolbarCapsule zoom={85} />
      <div className="absolute left-1/2 top-4 z-30 -translate-x-1/2 inline-flex items-center gap-0.5 rounded-full border border-glass-border bg-glass p-0.5 backdrop-blur-md">
        {D2_VARIANTS.map(v => (
          <button key={v.id} onClick={() => setVariant(v.id)}
            className={`rounded-full px-2.5 py-1 text-[11px] font-semibold transition ${
              variant === v.id ? "bg-primary text-white" : "text-text-muted hover:text-foreground"
            }`}>
            {v.label}
          </button>
        ))}
      </div>

      {/* Subtle context: a few media tiles, dim, so the strip is the focus */}
      <div className="absolute inset-0 opacity-55 pointer-events-none">
        <MediaNode kind="image" src={IMG.neonAlley} filename="NEON_REF.JPG" x={48} y={120} width={140} height={140} />
        <MediaNode kind="video" src={IMG.rooftop}   filename="cine_a.mp4"   duration="0:05" status="completed" selectedAsTake x={220} y={120} />
        <MediaNode kind="video" src={IMG.rain}      filename="cine_b.mp4"   duration="0:05" status="completed" x={444} y={120} />
        <MediaNode kind="video" src={IMG.hk}        filename="anime_b.mp4"  duration="0:04" status="completed" x={668} y={120} />
      </div>

      {variant === "collapsed" ? (
        <div className="absolute inset-x-4 bottom-4 z-20 flex items-center justify-between rounded-2xl border border-glass-border bg-glass px-4 py-2 backdrop-blur-md">
          <div className="flex items-center gap-2 text-[11px] text-text-secondary">
            <Icon name="scissors" size={12} className="text-text-muted" />
            <span className="font-mono uppercase tracking-wider text-text-muted">Sequence</span>
            <span>4 clips · 00:15:00</span>
          </div>
          <button className="btn-tip text-text-muted hover:text-foreground" data-tip="Expand strip">
            <Icon name="chevron-right" size={14} className="-rotate-90" />
          </button>
        </div>
      ) : (
        <SequenceStrip variant={variant} />
      )}

      {/* Spec footer */}
      <div className="absolute right-4 top-16 z-20 w-[320px] rounded-md border border-border-subtle bg-glass px-3 py-2 text-[11px] text-text-secondary">
        <div className="mb-1 font-mono text-[10px] uppercase tracking-wider text-text-muted">Spec · §5.4</div>
        Lightweight assembly, not an NLE. Clips of completed takes only. Drag to reorder. Total time on the right. Collapse to a 32-high handle when not in focus.
      </div>
    </div>
  );
};

/* ------------------------------------------------------------------ */
/* 14. Top-level shell with scene tabs                                 */
/* ------------------------------------------------------------------ */
const SCENES = [
  { id: "phase-b-1", label: "B-1 · Video Node (idle)",        spec: "§6.4",          render: <ScenePhaseB1 /> },
  { id: "phase-b-2", label: "B-2 · Generating + candidates",  spec: "§6.4 · §6.5",    render: <ScenePhaseB2 /> },
  { id: "phase-b-3", label: "B-3 · Capability mismatch",      spec: "§6.4.1",         render: <ScenePhaseB3 /> },
  { id: "phase-c-1", label: "C-1 · Agent Panel timeline",     spec: "§7 · §10.4",     render: <ScenePhaseC1 /> },
  { id: "phase-c-2", label: "C-2 · Permission modes",         spec: "§7.5 · §10.5",   render: <ScenePhaseC2 /> },
  { id: "phase-d-1", label: "D-1 · Canvas + connections",     spec: "§4 · §5 · §9",   render: <ScenePhaseD1 /> },
  { id: "phase-d-2", label: "D-2 · Sequence Strip states",    spec: "§5.4",           render: <ScenePhaseD2 /> },
];

const App = () => {
  const [sceneId, setSceneId] = useState(() => {
    const m = (typeof window !== "undefined" ? window.location.hash : "").match(/scene=([\w-]+)/);
    const fromHash = m && SCENES.find(s => s.id === m[1]);
    return fromHash ? m[1] : "phase-b-1";
  });

  useEffect(() => {
    if (typeof window === "undefined") return;
    window.history.replaceState(null, "", `#scene=${sceneId}`);
  }, [sceneId]);

  useEffect(() => {
    const onHash = () => {
      const m = window.location.hash.match(/scene=([\w-]+)/);
      if (m && SCENES.find(s => s.id === m[1])) setSceneId(m[1]);
    };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const active = SCENES.find(s => s.id === sceneId);

  return (
    <div className="flex h-screen w-screen flex-col bg-background text-foreground">
      {/* Header */}
      <header className="z-50 flex shrink-0 items-center justify-between border-b border-border-subtle bg-[#08080c]/90 px-4 py-2 backdrop-blur-md">
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2">
            <span className="grid h-7 w-7 place-items-center rounded-md bg-primary/15 text-primary">
              <Icon name="sparkles" size={13} />
            </span>
            <div className="leading-tight">
              <div className="font-display text-[13px] font-semibold text-foreground">LumenX Atelier</div>
              <div className="font-mono text-[10px] uppercase tracking-wider text-text-muted">Phase B · C · D · hi-fi prototype</div>
            </div>
          </div>
          <span className="rounded-full border border-glass-border bg-glass px-2 py-0.5 font-mono text-[10px] uppercase tracking-wider text-text-muted">
            v0.1 · 2026-05-15
          </span>
        </div>

        <div className="scene-tabs flex items-center gap-1 overflow-x-auto">
          {SCENES.map(s => (
            <button
              key={s.id}
              onClick={() => setSceneId(s.id)}
              className={`group inline-flex items-center gap-2 rounded-md px-2.5 py-1.5 text-[12px] font-medium transition whitespace-nowrap ${
                sceneId === s.id
                  ? "bg-primary text-white"
                  : "text-text-secondary hover:bg-hover-bg hover:text-foreground"
              }`}
            >
              <span>{s.label}</span>
              <span className={`font-mono text-[9px] uppercase tracking-wider ${
                sceneId === s.id ? "text-white/65" : "text-text-muted/80"
              }`}>{s.spec}</span>
            </button>
          ))}
        </div>

        <div className="flex items-center gap-2">
          <a
            href="../atelier-DESIGN.md"
            className="btn-tip rounded-md border border-glass-border bg-glass px-2.5 py-1.5 text-[11px] text-text-secondary hover:bg-hover-bg hover:text-foreground"
            data-tip="Open DESIGN.md (source of truth)"
          >
            DESIGN.md
          </a>
        </div>
      </header>

      {/* Scene viewport */}
      <main className="relative flex-1 overflow-hidden">
        {active.render}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
