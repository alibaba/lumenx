<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumenX Studio — Workspace Mock (Cinematic Restraint)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ SEED TOKENS ═══ */
:root {
  --seed-bg: #050508;
  --seed-fg: #ededed;
  --seed-primary: #646cff;
  --seed-secondary: #535bf2;
  --seed-accent: #ff0080;
  --seed-surface: rgba(255,255,255,0.04);
  --seed-radius: 8px;
}

/* ═══ SEMANTIC TOKENS ═══ */
:root {
  --color-bg-base: var(--seed-bg);
  --color-bg-surface: var(--seed-surface);
  --color-bg-elevated: #141416;
  --color-bg-inset: rgba(255,255,255,0.02);
  --color-bg-hover: rgba(255,255,255,0.06);
  --color-text-primary: var(--seed-fg);
  --color-text-secondary: #9ca3af;
  --color-text-muted: #6b7280;
  --color-border-default: rgba(255,255,255,0.08);
  --color-border-subtle: rgba(255,255,255,0.04);
  --color-primary: var(--seed-primary);
  --color-primary-hover: var(--seed-secondary);
  --color-overlay: rgba(0,0,0,0.85);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-subtle: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-elevated: 0 8px 32px rgba(0,0,0,0.6);
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-bg-base);
  color: var(--color-text-primary);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══ LAYOUT ═══ */
.app-shell {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* Global Sidebar */
.global-sidebar {
  width: 220px;
  flex-shrink: 0;
  height: 100%;
  border-right: 1px solid var(--color-border-default);
  background: var(--color-bg-surface);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(2px);
}
.sidebar-branding {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--color-border-subtle);
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  background-image: url("LumenX-cybr.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.brand-icon span {
  display: none;
}
.brand-name {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-name .x-accent {
  color: var(--color-primary);
  font-weight: 900;
}
.brand-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 4px;
}

.sidebar-nav {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  position: relative;
  border: 1px solid transparent;
}
.nav-item:hover {
  background: var(--color-bg-hover);
}
.nav-item.active {
  background: rgba(100,108,255,0.08);
  border-color: rgba(100,108,255,0.15);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 25%;
  height: 50%;
  width: 2px;
  background: var(--color-primary);
  border-radius: 0 2px 2px 0;
}
.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.5;
}
.nav-item.active .icon { opacity: 1; color: var(--color-primary); }
.nav-item .label {
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-secondary);
}
.nav-item.active .label { color: var(--color-text-primary); }

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--color-border-subtle);
}
.sidebar-footer span {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--color-text-muted);
  padding-left: 14px;
}

/* Main content */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 40px 48px;
}

/* Page header */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
}
.page-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--color-text-primary);
}
.page-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-text-muted);
  margin-left: 10px;
  letter-spacing: 0.1em;
}
.header-actions {
  display: flex;
  gap: 8px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  border: 1px solid var(--color-border-default);
  background: var(--color-bg-hover);
  color: var(--color-text-primary);
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn-primary {
  background: linear-gradient(160deg, #6269e8 5%, #4a50c6 60%, #3d42a8 100%);
  border-color: rgba(130,140,255,0.28);
  color: #fff;
  box-shadow: 0 0 14px rgba(100,108,255,0.2), inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.15);
}
.btn-primary:hover {
  background: linear-gradient(160deg, #6e75f0 5%, #5258d0 60%, #4548b2 100%);
  box-shadow: 0 0 20px rgba(100,108,255,0.3), inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.12);
}

/* Grid */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

/* Series Card */
.series-card {
  grid-column: span 2;
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
  position: relative;
  border-left: 2px solid var(--color-primary);
}
.series-card:hover {
  background: var(--color-bg-hover);
  border-color: rgba(255,255,255,0.12);
}
.series-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  background: rgba(100,108,255,0.12);
  color: rgba(100,108,255,0.85);
}
.series-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 8px 0 4px;
  letter-spacing: -0.01em;
}
.series-meta {
  font-size: 12px;
  color: var(--color-text-secondary);
  display: flex;
  gap: 12px;
}
.series-meta .dot { color: var(--color-text-muted); }

/* Episode strip */
.episode-strip {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--color-border-subtle);
  overflow-x: auto;
}
.ep-chip {
  flex-shrink: 0;
  width: 100px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  background: var(--color-bg-inset);
  border: 1px solid var(--color-border-subtle);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
}
.ep-chip:hover { 
  background: var(--color-bg-hover);
  border-color: var(--color-border-default);
}
.ep-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--color-primary);
  letter-spacing: 0.05em;
}
.ep-title {
  font-size: 11px;
  color: var(--color-text-primary);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ep-meta {
  font-size: 10px;
  color: var(--color-text-muted);
  margin-top: 2px;
}
.ep-add {
  flex-shrink: 0;
  width: 100px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--color-border-default);
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
}
.ep-add:hover { border-color: var(--color-text-muted); background: var(--color-bg-inset); }
.ep-add .plus { font-size: 16px; color: var(--color-text-muted); }
.ep-add span { font-size: 10px; color: var(--color-text-muted); }

/* Project Card */
.project-card {
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-lg);
  padding: 18px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease);
}
.project-card:hover {
  background: var(--color-bg-hover);
  border-color: rgba(255,255,255,0.12);
}
.project-card .thumb {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: var(--radius-md);
  background: var(--color-bg-inset);
  margin-bottom: 12px;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.project-card .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.project-card .thumb .placeholder {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.18em;
}
.project-card .title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: -0.005em;
}
.project-card .desc {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-bottom: 8px;
}
.project-card .footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.project-card .date {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--color-text-muted);
}
.project-card .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: oklch(0.88 0.16 155);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
<div class="app-shell">
  <!-- Global Sidebar -->
  <aside class="global-sidebar">
    <div class="sidebar-branding">
      <div class="brand-row">
        <div class="brand-icon"><span>X</span></div>
        <div>
          <div class="brand-name">LUMEN<span class="x-accent">X</span></div>
          <div class="brand-tag">STUDIO</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <span class="label">工作区</span>
      </div>
      <div class="nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        <span class="label">资产库</span>
      </div>
      <div class="nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68 1.65 1.65 0 0010 3.17V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span class="label">设置</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <span>v0.2.0</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <div>
        <span class="page-title">工作区</span>
        <span class="page-count">4 PROJECTS</span>
      </div>
      <div class="header-actions">
        <button class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          同步
        </button>
        <button class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          导入
        </button>
        <button class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建
        </button>
      </div>
    </div>

    <!-- Project Grid -->
    <div class="project-grid">
      <!-- Series Card 1 -->
      <div class="series-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <span class="series-badge">SERIES</span>
        </div>
        <div class="series-title">都市奇幻录</div>
        <div class="series-meta">
          <span>集数 <strong style="color:var(--color-text-primary)">6</strong></span>
          <span class="dot">·</span>
          <span>角色 <strong style="color:var(--color-text-primary)">8</strong></span>
          <span class="dot">·</span>
          <span>场景 <strong style="color:var(--color-text-primary)">12</strong></span>
        </div>
        <div class="episode-strip">
          <div class="ep-chip">
            <div class="ep-num">EP01</div>
            <div class="ep-title">初遇</div>
            <div class="ep-meta">24 shots</div>
          </div>
          <div class="ep-chip">
            <div class="ep-num">EP02</div>
            <div class="ep-title">觉醒</div>
            <div class="ep-meta">18 shots</div>
          </div>
          <div class="ep-chip">
            <div class="ep-num">EP03</div>
            <div class="ep-title">对决</div>
            <div class="ep-meta">32 shots</div>
          </div>
          <div class="ep-chip">
            <div class="ep-num">EP04</div>
            <div class="ep-title">追忆</div>
            <div class="ep-meta">12 shots</div>
          </div>
          <div class="ep-add">
            <span class="plus">+</span>
            <span>新增</span>
          </div>
        </div>
      </div>

      <!-- Project Cards -->
      <div class="project-card">
        <div class="thumb"><span class="placeholder">16:9 Preview</span></div>
        <div class="title">赛博朋克独白</div>
        <div class="desc">科幻独白短片 · 3 shots</div>
        <div class="footer">
          <span class="date">2026-06-02</span>
          <span class="status-dot"></span>
        </div>
      </div>

      <div class="project-card">
        <div class="thumb"><span class="placeholder">16:9 Preview</span></div>
        <div class="title">古风水墨试验</div>
        <div class="desc">水墨风格测试 · 5 shots</div>
        <div class="footer">
          <span class="date">2026-05-28</span>
          <span class="status-dot" style="background:oklch(0.88 0.16 80)"></span>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
