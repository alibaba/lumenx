family: vidu
display_name: Vidu
provider: vidu
routing_prefixes:
  - vidu/vidu
  - vidu
supported_backends:
  - dashscope
  - vendor
default_backend: dashscope
backend_env_key: VIDU_PROVIDER_MODE
credential_sources:
  dashscope:
    - DASHSCOPE_API_KEY
  vendor:
    - VIDU_API_KEY
supported_modalities:
  - i2v
  - r2v
transport:
  image_input_mode:
    dashscope: dashscope_image_to_video
    vendor: vidu_vendor_image_url
  audio_input_mode:
    dashscope: dashscope_temp_file_url
    vendor: vidu_vendor_audio_url
  reference_video_input_mode:
    dashscope: dashscope_temp_file_url
    vendor: vidu_vendor_video_url
docs:
  official_snapshot_ids:
    - vidu/2026-04-25
models:
  - id: vidu/viduq3-pro-video
    display_name: Vidu Q3 Pro Video
    description: Vidu Q3 Pro with I2V and R2V modes
    status: active
    release_stage: stable
    runtime:
      dashscope:
        gateway: dashscope_workspace
      vendor:
        gateway: vidu
    docs:
      context_hub_doc_ids:
        - aliyun/bailian-vidu-proxy
        - vidu/vendor-api
    modes:
      i2v:
        legacy_id: viduq3-pro-i2v
        display_name: Vidu Q3 Pro I2V
        description: Vidu latest model for image-to-video
        capabilities: [i2v]
        runtime:
          dashscope:
            api_model_id: vidu/viduq3-pro_img2video
            gateway: dashscope_workspace
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 60
          badges: [proxy-capable]
        duration:
          type: slider
          min: 1
          max: 16
          step: 1
          default: 5
        params:
          resolution:
            options: [540P, 720P, 1080P]
            default: 720P
          seed:
            min: 0
            max: 2147483647
          promptExtend: false
          watermark:
            default: false
          audio:
            default: false
        inputs:
          reference_images:
            max: 1
            reference_type: image
            mime_types: [image/jpeg, image/png, image/webp]
            max_bytes: 52428800
            aspect_ratio:
              min: 0.25
              max: 4
      r2v:
        legacy_id: viduq3-pro-r2v
        display_name: Vidu Q3 Pro R2V
        description: Vidu reference-to-video with multi-image support
        capabilities: [r2v]
        runtime:
          dashscope:
            api_model_id: vidu/viduq3-mix_reference2video
            gateway: dashscope_workspace
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 75
        duration:
          type: slider
          min: 1
          max: 16
          step: 1
          default: 5
        params:
          resolution:
            options: [720P, 1080P]
            default: 720P
          aspectRatio:
            options: ["16:9", "4:3", "1:1", "3:4", "9:16"]
            default: "16:9"
          seed:
            min: 0
            max: 2147483647
          promptExtend: false
          watermark:
            default: false
          audio:
            default: false
        inputs:
          reference_images:
            max: 7
            reference_type: image
            mime_types: [image/jpeg, image/png, image/webp]
            max_bytes: 52428800
            aspect_ratio:
              min: 0.25
              max: 4

