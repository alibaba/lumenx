family: happyhorse
display_name: "HappyHorse (快乐马)"
provider: aliyun
routing_prefixes:
  - happyhorse-1.0-
  - happyhorse-1.1-
supported_backends:
  - dashscope
default_backend: dashscope
credential_sources:
  dashscope:
    - DASHSCOPE_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
  - v2v
transport:
  image_input_mode:
    dashscope: dashscope_temp_file_url
  audio_input_mode:
    dashscope: dashscope_temp_file_url
  reference_video_input_mode:
    dashscope: dashscope_temp_file_url
docs:
  official_snapshot_ids:
    - aliyun/happyhorse/2026-04-28
models:
  # Model line: I2V + R2V (paired via modes) — upgraded to 1.1
  - id: happyhorse/happyhorse-1.1-video
    display_name: HappyHorse 1.1 Video
    description: HappyHorse video generation with I2V and R2V modes
    status: active
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - aliyun/happyhorse-video
    runtime:
      dashscope:
        gateway: dashscope_workspace
    modes:
      i2v:
        legacy_id: happyhorse-1.1-i2v
        display_name: HappyHorse I2V
        description: Image-to-video with one first frame
        capabilities: [i2v]
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 120
          recommended: true
        duration:
          type: slider
          min: 3
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            options: [480P, 720P, 1080P]
            default: 1080P
          seed: true
          watermark:
            default: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: happyhorse-1.1-r2v
        display_name: HappyHorse R2V
        description: Reference images to video generation
        capabilities: [r2v]
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 80
          recommended: true
        duration:
          type: slider
          min: 3
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            options: [480P, 720P, 1080P]
            default: 1080P
          ratio:
            options: ["16:9", "9:16", "1:1", "4:3", "3:4", "9:21", "21:9", "4:5", "5:4"]
            default: "16:9"
          seed: true
          watermark:
            default: true
        inputs:
          reference_images:
            max: 9
            reference_type: image
  # Separate 1.1 T2V line keeps the provider flat ID distinct from I2V/R2V.
  - id: happyhorse/happyhorse-1.1-t2v
    display_name: HappyHorse 1.1 T2V
    description: Text-to-video generation (hidden)
    status: hidden
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - aliyun/happyhorse-video
    runtime:
      dashscope:
        gateway: dashscope_workspace
    modes:
      t2v:
        legacy_id: happyhorse-1.1-t2v
        display_name: HappyHorse T2V
        description: Text-to-video generation (hidden)
        status: hidden
        capabilities: [t2v]
        ui:
          selection_group: i2v
          visible_in: []
          order: 120
          recommended: true
        duration:
          type: slider
          min: 3
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            options: [480P, 720P, 1080P]
            default: 1080P
          ratio:
            options: ["16:9", "9:16", "1:1", "4:3", "3:4", "9:21", "21:9", "4:5", "5:4"]
            default: "16:9"
          seed: true
          watermark:
            default: true
        inputs:
          media:
            max: 0
  # Standalone: V2V (hidden) — stays on 1.0 (no 1.1 video-edit yet)
  - id: happyhorse/happyhorse-1.0-video-edit
    display_name: HappyHorse 1.0 VideoEdit
    description: Video editing from one source video (hidden, still 1.0)
    status: hidden
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - aliyun/happyhorse-video
    runtime:
      dashscope:
        gateway: dashscope_workspace
    modes:
      v2v:
        legacy_id: happyhorse-1.0-video-edit
        display_name: HappyHorse VideoEdit
        description: Video editing from one managed source video
        status: hidden
        capabilities: [v2v]
        ui:
          selection_group: i2v
          visible_in: []
          recommended: true
        params:
          resolution:
            options: [720P, 1080P]
            default: 1080P
          seed: true
          watermark:
            default: true
          audioSetting:
            options: [auto, origin]
            default: auto
        inputs:
          media:
            max: 1
            reference_type: video
