server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The exported shell uses hash routing. Real static files stay here; every
    # other path belongs to Core, including new product/auth/runtime endpoints.
    # Returning index.html for an unknown API path hides deployment failures.
    client_max_body_size 256m;
    location / {
        try_files $uri $uri.html $uri/ @lumenx_core;
    }

    location @lumenx_core {
        proxy_pass http://backend:17177;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keep SSE and upload validation streaming; media Range headers pass
        # through unchanged. Core owns the narrower per-operation limits.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
    }
}
